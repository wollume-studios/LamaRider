# Any property can be overwritten from command-line via
#   -P<propertyName>=<value>

DotnetPluginId=LamaRider
DotnetSolution=LamaRider.sln
RiderPluginId=dev.lamarider
PluginVersion=0.6.0

BuildConfiguration=Debug

# Rider to build against (frontend), its JetBrains.Rider.SDK (backend) and the first build it supports. Built against
# 2026.2, the plugin also runs in 2026.3 (UI tests pass in both); 2026.1 would need code changes (ToDataContext2).
# Another Rider: -PProductVersion=2026.3-EAP6-SNAPSHOT -PSdkVersion=2026.3.0-eap06 -PSinceBuild=263
ProductVersion=2026.2.3
SdkVersion=2026.2.3.1
SinceBuild=262

kotlin.stdlib.default.dependency=false

# Required to download Rider artifacts from Maven (and not "binary" releases from CDN).
org.jetbrains.intellij.platform.buildFeature.useBinaryReleases=false

# Public base URL of docs/screenshots for the plugin description images (empty: description without images)
ScreenshotBaseUrl=https://raw.githubusercontent.com/wollume-studios/LamaRider/main/docs/screenshots
